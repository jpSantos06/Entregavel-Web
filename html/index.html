<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog</title>
</head>

<body>

<header>
    <h1>Meu Blog</h1>

    <nav>
        <a href="#inicio">Início</a>
        <a href="#artigos">Artigos</a>
        <a href="#cadastro">Cadastro</a>
    </nav>
</header>

<main id="inicio">

    <article id="artigos">
        <h2>Primeiro artigo</h2>
        <p>Este é um texto sobre o blog.</p>
        <img src="https://picsum.photos/300/150" alt="Imagem de tecnologia">
    </article>

    <article>
        <h2>Segundo artigo</h2>
        <p>Aprender HTML é importante para criar sites.</p>
        <img src="https://picsum.photos/300/150" alt="Imagem de computador">
    </article>

</main>

<aside id="cadastro">

    <h2>Inscreva-se</h2>

    <form method="get">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" minlength="3" required>
        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" min="18" max="120" required>
        <br><br>

        <label for="assunto">Assunto:</label>
        <select id="assunto" name="assunto">
            <option value="tecnologia">Tecnologia</option>
            <option value="programacao">Programação</option>
            <option value="html">HTML</option>
        </select>
        <br><br>

        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos">Aceito os termos</label>
        <br><br>

        <button type="submit">Enviar</button>

    </form>

</aside>

<footer>
    <p>Meu Blog - 2026</p>
</footer>

</body>
</html>
